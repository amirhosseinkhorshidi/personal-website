<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="امیرحسین خورشیدی، توسعه‌دهنده فرانت‌اند با React و TypeScript. اینجا از خودم و پروژه‌هام می‌نویسم." />

    <!-- Resolved values of --background in styles/globals.css; a meta tag cannot
         read a CSS custom property, so these are kept in sync by hand. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f6f9" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#151518" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- crossorigin is required even same-origin: fonts are fetched in CORS mode,
         and without it the browser downloads the file twice. -->
    <link
      rel="preload"
      href="/fonts/vazirmatn-33.003-variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>امیرحسین خورشیدی | درباره من و پروژه‌هام</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
