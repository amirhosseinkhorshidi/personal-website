<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The title, description, canonical link and per-page share tags come from
         each page's <PageMeta>; the build writes them in here for every page. -->

    <!-- Share preview, the same on every page. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="امیرحسین خورشیدی" />
    <meta property="og:locale" content="fa_IR" />
    <meta property="og:image" content="https://khorshidi.dev/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="امیرحسین خورشیدی، توسعه‌دهنده فرانت‌اند" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Resolved values of --background in styles/globals.css; a meta tag cannot
         read a CSS custom property, so these are kept in sync by hand. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f6f9" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#151518" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- crossorigin is required even same-origin: fonts are fetched in CORS mode,
         and without it the browser downloads the file twice. -->
    <link
      rel="preload"
      href="/fonts/vazirmatn-33.003-variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
